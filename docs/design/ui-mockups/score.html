<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow &amp; Fire – Auswertung</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/ff.css">
<link rel="stylesheet" href="assets/menus.css">
<script src="assets/strategic-icons.js"></script>
<script src="assets/ff.js"></script>
</head>
<!-- Score-Screen (A13 MS14; Minimal-Endbildschirm Sieg/Niederlage ab MS5/MS9, A4). ?result=loss zeigt die Niederlage. -->
<body class="menu-page">
<div class="menu-bg"><canvas></canvas></div>
<div class="menu-root" data-component="ScoreScreen">
  <div class="menu-top">
    <span class="crumb">Setons · Assassination · 1v1 · 24:18</span>
    <div class="sp"><div class="ff-tabs" data-tabs="sc"><button class="ff-tab is-selected" data-tab="o">Übersicht</button><button class="ff-tab" data-tab="e">Wirtschaft</button><button class="ff-tab" data-tab="a">Armee</button><button class="ff-tab" data-tab="u">Einheiten</button></div></div>
  </div>
  <div class="score">
    <div class="verdict" id="verdict"></div>
    <div class="rule"></div>
    <div class="sgrid">
      <div class="ff-panel" style="align-self:start">
        <table class="stbl" aria-label="Kennzahlen">
          <thead><tr><th>Kennzahl</th><th><span style="--team:var(--team-self)"><i></i>Ambrecht</span></th><th><span style="--team:var(--team-enemy)"><i></i>Dorne</span></th></tr></thead>
          <tbody id="tbl"></tbody>
        </table>
        <div class="ff-ph" style="border-top:1px solid var(--line)">Beste Einheiten · Ambrecht</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:.5rem">
          <div id="best" style="display:contents"></div>
        </div>
      </div>
      <div class="charts">
        <div class="events"><span>Ereignisse:</span><span>04:12 erste Fabrik (beide)</span><span>·</span><span>09:40 Landwerk II (Ambrecht)</span><span>·</span><span>12:05 Landwerk II (Dorne)</span><span>·</span><span>18:31 Brücke gehalten</span><span>·</span><span>24:18 Lotbruch Dorne</span></div>
        <div class="chart ff-panel" id="c1"></div>
        <div class="chart ff-panel" id="c2"></div>
      </div>
    </div>
  </div>
  <div class="menu-foot">
    <span>Werte stammen 1:1 aus den Sim-Stats (Hash-geprüft), nicht aus dem Client.</span>
    <div class="sp"><button class="ff-btn">Replay speichern</button><button class="ff-btn">Replay ansehen</button><button class="ff-btn">Revanche</button><button class="ff-btn ff-btn--primary">Hauptmenü</button></div>
  </div>
</div>
<script>
  FF.applyScale(); FF.menuBg(41, [0.3, 0.3, 0.9, 0.62]);

  FF.bindTabs();
  const loss = FF.qs.get('result') === 'loss';
  document.getElementById('verdict').innerHTML = loss
    ? `<div><h2 style="color:#ffb3a8">Lot gebrochen</h2><p>Anspruch erloschen. Die Charta erklärt alles Gegossene zu Schlacke.</p></div>`
    : `<div><h2>Sieg</h2><p>Haus Dornes Lot ist gebrochen. Die Ader gehört Haus Ambrecht.</p></div>`;
  document.getElementById('verdict').innerHTML += `<div class="meta"><span>Spielzeit<b class="num">24:18</b></span><span>Punkte<b class="num">18.240</b></span><span>Effizienz<b class="num">91 %</b></span><span>Replay<b class="num">118 KB</b></span></div>`;
  const rows = [
    ['Wirtschaft'], ['Mass gefördert', 18412, 16905], ['Energy erzeugt', 412300, 388100], ['Mass aus Reclaim', 2140, 860], ['Zeit im Stall', '0:48', '2:12', true], ['Mex (Höchststand)', 14, 11],
    ['Armee'], ['Einheiten gebaut', 162, 171], ['Einheiten verloren', 88, 131, true], ['Gegner zerstört', 131, 88], ['Mass-Wert zerstört', 9820, 6410], ['Höchste Veteranenstufe', 3, 2],
  ];
  document.getElementById('tbl').innerHTML = rows.map((r) => r.length === 1 ? `<tr class="grp"><th colspan="3">${r[0]}</th></tr>` : (() => {
    const [n, a, b, low] = r; const na = typeof a === 'number', better = na ? (low ? a < b : a > b) : low ? a < b : a > b;
    return `<tr><th>${n}</th><td class="${better ? 'win' : ''}">${na ? FF.n0(a) : a}</td><td class="${!better ? 'win' : ''}">${na ? FF.n0(b) : b}</td></tr>`;
  })()).join('');

  document.getElementById('best').innerHTML = [['land_direct_t1', 'Punze', 48], ['land_arty_t1', 'Kelle', 31], ['struct_direct_t1', 'Riegel I', 22], ['cmd_commander', 'Vogt', 17]].map(([i, n, k]) => `<div style="display:grid;justify-items:center;gap:.125rem;padding:.375rem;background:var(--surface-1)">${FF.si(i)}<b style="font-size:var(--fs-cap);color:var(--text-hi)">${n}</b><span class="num ff-dim" style="font-size:var(--fs-micro)">${k} Abschüsse</span></div>`).join('');
  // Linien-Charts (eine Achse, 2 Serien = Teamfarben, Legende + Direktbeschriftung, Hover-Crosshair)
  function series(seed, peak, bump) { const r = []; let v = 4; for (let t = 0; t <= 24; t++) { v += (peak / 24) * (0.7 + ((Math.sin(t * seed) + 1) / 2) * 0.6) - (t === bump ? peak * 0.18 : 0); r.push(Math.max(0, v)); } return r; }
  function chart(id, title, sub, unit, A, B) {
    const el = document.getElementById(id);
    el.innerHTML = `<div class="chart__h"><b>${title}</b><small>${sub}</small><span class="lg"><span style="--team:var(--team-self)"><i></i>Ambrecht</span><span style="--team:var(--team-enemy)"><i class="dash"></i>Dorne</span></span></div><div style="position:relative;min-height:0"><svg></svg><div class="charttip" hidden></div></div>`;
    const svg = el.querySelector('svg'), wrap = svg.parentElement, tip = el.querySelector('.charttip');
    const draw = () => {
      const W = wrap.clientWidth, H = wrap.clientHeight, L = 44, R = 70, T = 12, Bm = 22;
      const raw = Math.max(...A, ...B) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((m) => m >= raw), max = step * 4, x = (i) => L + (i / 24) * (W - L - R), y = (v) => T + (1 - v / max) * (H - T - Bm);
      let s = '';
      for (let k = 0; k <= 4; k++) { const v = (max / 4) * k; s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="tk" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${FF.n0(v)}</text>`; }
      for (let t = 0; t <= 24; t += 4) s += `<text class="tk" x="${x(t)}" y="${H - 5}" text-anchor="middle">${t}:00</text>`;
      s += `<line class="ax" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>`;
      const path = (d) => d.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
      const ts = getComputedStyle(document.documentElement);
      s += `<path d="${path(B)}" fill="none" stroke="var(--team-enemy)" stroke-width="2" stroke-dasharray="6 4"/>`;
      s += `<path d="${path(A)}" fill="none" stroke="var(--team-self)" stroke-width="2"/>`;
      s += `<circle cx="${x(24)}" cy="${y(A[24])}" r="4" fill="var(--team-self)" stroke="#171412" stroke-width="2"/><text class="lab" x="${x(24) + 8}" y="${y(A[24]) + 4}">${FF.n0(A[24])}</text>`;
      s += `<circle cx="${x(24)}" cy="${y(B[24])}" r="4" fill="var(--team-enemy)" stroke="#171412" stroke-width="2"/><text class="lab" x="${x(24) + 8}" y="${y(B[24]) + 4}">${FF.n0(B[24])}</text>`;
      s += `<g class="xh" visibility="hidden"><line x1="0" x2="0" y1="${T}" y2="${y(0)}" stroke="var(--iron-300)" stroke-dasharray="2 3"/></g><rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - Bm}" fill="transparent" class="hit"/>`;
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = s;
      const hit = svg.querySelector('.hit'), xh = svg.querySelector('.xh');
      hit.addEventListener('mousemove', (e) => {
        const r = svg.getBoundingClientRect(), i = Math.max(0, Math.min(24, Math.round(((e.clientX - r.left - L) / (W - L - R)) * 24)));
        xh.setAttribute('visibility', 'visible'); xh.setAttribute('transform', `translate(${x(i)},0)`);
        tip.hidden = false; tip.style.left = Math.min(x(i) + 10, W - 170) + 'px'; tip.style.top = '10px';
        tip.innerHTML = `<b>${i}:00</b><span style="--team:var(--team-self)"><i></i>Ambrecht ${FF.n0(A[i])} ${unit}</span><span style="--team:var(--team-enemy)"><i></i>Dorne ${FF.n0(B[i])} ${unit}</span>`;
      });
      hit.addEventListener('mouseleave', () => { xh.setAttribute('visibility', 'hidden'); tip.hidden = true; });
    };
    draw(); window.addEventListener('resize', draw);
  }
  chart('c1', 'Mass-Einkommen', 'pro Sekunde, Minutenmittel', 'M/s', series(1.3, 60, 14), series(0.7, 52, 9));
  chart('c2', 'Armeewert', 'Mass-Wert lebender Kampfeinheiten', 'M', series(2.1, 4200, 18).map((v, i) => v * (i > 18 ? 0.9 : 1)), series(1.1, 3900, 18).map((v, i) => (i > 18 ? v * (1 - (i - 18) * 0.14) : v)));
</script>
</body>
</html>
