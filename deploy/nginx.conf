# Flow & Fire (FAF) – static hosting of apps/game/dist (PLAN §2 "Hosting", §3.1 build versioning, G20).
#
# Layout of the document root (output of `pnpm build`, copy apps/game/dist/ to /srv/faf/):
#   /index.html              redirect page to the current build (keeps ?query and #hash)
#   /build.json              { "buildHash": "<hash>" } of the current build
#   /b/<buildHash>/...       one complete client (page, JS, workers) per build; old builds stay,
#                            so replays can be played with the client they were recorded with.
#   /b/<buildHash>/assets/   pipeline assets: manifest.json + content-hashed maps (.rtsmap), sim.bin,
#                            view.json, models (.glb); the client caches them in the Cache API.
#
# Use as a server block (e.g. /etc/nginx/conf.d/faf.conf; the stock nginx.conf includes conf.d/*.conf
# inside `http {}`). TLS is expected to terminate in front of nginx (Dokploy/Traefik); cross-origin
# isolation (SharedArrayBuffer transport) needs a secure context, i.e. https or localhost.
# Check: `nginx -t -c /etc/nginx/nginx.conf`.

# Immutable caching only for successful responses: a 404 for a build that is not deployed yet must not
# be cached forever. (conf.d files are included inside `http {}`, where `map` belongs.)
map $status $faf_build_cache {
    200     "public, max-age=31536000, immutable";
    206     "public, max-age=31536000, immutable";
    304     "public, max-age=31536000, immutable";
    default "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /srv/faf;
    index index.html;
    charset utf-8;

    # MIME types: a complete, self-contained table (mirrors apps/game/scripts/serve.mjs) instead of the
    # stock mime.types, so nothing depends on the distro's table. ES modules and module workers must be
    # JavaScript; wasm must be application/wasm (streaming compile); sim.bin/.faflog/.rtsmap are raw
    # bytes, models are binary glTF (asset pipeline, /b/<hash>/assets/).
    types {
        text/html                 html;
        text/javascript           js mjs;
        text/css                  css;
        application/json          json map;
        application/wasm          wasm;
        application/octet-stream  bin faflog rtsmap;
        text/plain                txt;
        image/svg+xml             svg;
        image/png                 png;
        image/jpeg                jpg jpeg;
        image/webp                webp;
        image/x-icon              ico;
        image/ktx2                ktx2;
        model/gltf-binary         glb;
        model/gltf+json           gltf;
        font/woff2                woff2;
        audio/ogg                 ogg opus;
        audio/mpeg                mp3;
    }
    default_type application/octet-stream;

    # Compression for text assets (the arena/sim.bin payloads are tiny; wasm compresses well).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # Raw bytes too: the .rtsmap (16-bit heightmap) is the largest asset and compresses well; the client
    # counts decoded bytes (progress totals come from the asset manifest, not Content-Length).
    gzip_types text/javascript application/json application/wasm text/css image/svg+xml application/octet-stream model/gltf-binary;

    # Cross-origin isolation (crossOriginIsolated === true → SAB triple-buffer frame transport):
    # COOP same-origin + COEP require-corp + CORP same-origin on every response. `add_header` is not
    # inherited into a location that declares its own add_header, so every location repeats the set.

    # Versioned builds: the hash names the content → cache forever.
    location ^~ /b/ {
        # Unknown build → 404 (never fall back to another build's page).
        try_files $uri $uri/index.html =404;
        add_header Cache-Control $faf_build_cache always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Current-build pointer: always revalidate.
    location = /build.json {
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Root → redirect page of the current build (dist/index.html, generated by the build; JS keeps
    # query and hash, <meta refresh> covers clients without JS).
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Anything else outside /b/ does not exist (no SPA fallback, no directory listing).
    location / {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
