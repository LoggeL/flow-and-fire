<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flow &amp; Fire · FX-Lab</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d0f12;
        color: #e8e2d6;
        font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #c {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
      }
      .hud {
        position: fixed;
        top: 8px;
        left: 8px;
        max-width: min(560px, calc(100vw - 16px));
        padding: 8px 10px;
        background: rgba(12, 13, 16, 0.72);
        border: 1px solid rgba(255, 150, 60, 0.25);
        border-radius: 6px;
        user-select: none;
      }
      .hud-title {
        font-weight: 700;
        color: #ffb870;
        margin-bottom: 6px;
      }
      .hud-row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 6px;
        align-items: center;
        margin-bottom: 6px;
      }
      .hud-key {
        color: #a9a196;
      }
      .hud-btn,
      .hud-select {
        font: inherit;
        color: #e8e2d6;
        background: #22252b;
        border: 1px solid #3a3e46;
        border-radius: 4px;
        padding: 2px 8px;
        cursor: pointer;
      }
      .hud-btn:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .hud-btn.active {
        border-color: #ff9a3c;
        color: #ffcf9a;
      }
      .hud-toggle {
        display: inline-flex;
        gap: 3px;
        align-items: center;
      }
      .hud-stats {
        margin: 0;
        white-space: pre-wrap;
        color: #d6d0c4;
      }
      .hud-error {
        margin: 6px 0 0;
        white-space: pre-wrap;
        color: #ff7a6a;
        max-height: 30vh;
        overflow: auto;
      }
      .hud-labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .hud-label {
        position: absolute;
        left: 0;
        top: 0;
        padding: 1px 5px;
        white-space: nowrap;
        background: rgba(10, 10, 12, 0.6);
        border-radius: 3px;
        color: #ffe2bd;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
