<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flow &amp; Fire – Marker-Editor</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #161b22;
        color: #d8dee6;
        font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #viewport {
        position: absolute;
        inset: 0;
      }
      #terrain {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        outline: none;
        user-select: none;
        -webkit-user-select: none;
      }
      /* Panels (src/ui) sit on top; they switch pointer-events back on for themselves. */
      #ui {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      /* Map summary for screen readers and the E2E tests (live region, visually hidden). */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
      #app.drop-active #viewport::after {
        content: '.rtsmap-Datei hier ablegen';
        position: absolute;
        inset: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px dashed #7fb2ff;
        border-radius: 8px;
        background: rgba(22, 27, 34, 0.55);
        color: #cfe2ff;
        font-size: 18px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="viewport">
        <canvas id="terrain" tabindex="0" aria-label="Kartenansicht"></canvas>
      </div>
      <div id="ui"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
