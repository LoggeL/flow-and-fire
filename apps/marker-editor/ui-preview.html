<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flow &amp; Fire – UI-Vorschau (Marker-Editor)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #161b22;
        color: #d8dee6;
        font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #viewport,
      #terrain {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        outline: none;
      }
      #ui {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="viewport"><canvas id="terrain" tabindex="0"></canvas></div>
      <div id="ui"></div>
    </div>
    <script type="module" src="/src/ui/preview.ts"></script>
  </body>
</html>
