<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flow &amp; Fire – Overlay-Demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #161b22;
        color: #d8dee6;
        font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #terrain {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        outline: none;
      }
      #status {
        position: fixed;
        left: 12px;
        top: 10px;
        padding: 4px 10px;
        border-radius: 4px;
        background: rgba(12, 16, 22, 0.72);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="terrain" tabindex="0"></canvas>
    <div id="status">Lade Karte …</div>
    <script type="module">
      import('/src/overlay/demo.ts');
    </script>
  </body>
</html>
