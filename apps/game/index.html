<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flow &amp; Fire</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0f14;
        color: #d7e1ea;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      #game-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        outline: none;
      }
      #ui-root {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font-size: 12px;
      }
      .faf-dim { opacity: 0.6; }
      .faf-hud {
        position: absolute;
        left: 10px;
        top: 10px;
        padding: 8px 10px;
        background: rgba(8, 12, 18, 0.72);
        border: 1px solid rgba(120, 160, 200, 0.25);
        border-radius: 4px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        min-width: 210px;
      }
      .faf-hud-title { font-family: system-ui, sans-serif; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
      .faf-hud th { text-align: left; font-weight: normal; opacity: 0.65; padding-right: 10px; }
      .faf-hud td { text-align: right; }
      .faf-hint { margin-top: 6px; opacity: 0.55; font-size: 11px; max-width: 260px; font-family: system-ui, sans-serif; }
      .faf-banner {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 18px;
        background: rgba(20, 30, 40, 0.8);
        border: 1px solid rgba(255, 210, 90, 0.6);
        color: #ffd25a;
        font-weight: 700;
        letter-spacing: 0.2em;
        border-radius: 3px;
      }
      .faf-warn { top: 52px; letter-spacing: normal; color: #ff9a6a; border-color: rgba(255, 140, 90, 0.6); }
      .faf-fatal {
        position: absolute;
        inset: 30% 20% auto 20%;
        padding: 16px;
        background: rgba(60, 10, 10, 0.9);
        border: 1px solid #ff6a6a;
        color: #ffd0d0;
        pointer-events: auto;
      }
      .faf-drag {
        position: absolute;
        border: 1px solid rgba(90, 255, 120, 0.9);
        background: rgba(90, 255, 120, 0.12);
      }
      .faf-budget {
        position: absolute;
        right: 10px;
        top: 10px;
        padding: 8px 10px;
        background: rgba(8, 12, 18, 0.8);
        border: 1px solid rgba(120, 160, 200, 0.25);
        border-radius: 4px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        pointer-events: auto;
      }
      .faf-budget td, .faf-budget th { padding: 0 6px; text-align: right; }
      .faf-budget td:first-child, .faf-budget th:first-child { text-align: left; }
      .faf-budget .faf-total td { font-weight: 700; }
      .faf-panel-title { font-family: system-ui, sans-serif; font-weight: 600; margin-bottom: 4px; }
      .faf-console {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 38%;
        display: flex;
        flex-direction: column;
        background: rgba(6, 9, 13, 0.9);
        border-top: 1px solid rgba(120, 160, 200, 0.35);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        pointer-events: auto;
      }
      .faf-console-log { flex: 1; overflow-y: auto; padding: 6px 10px; white-space: pre-wrap; }
      .faf-line.faf-in { color: #8fc7ff; }
      .faf-line.faf-err { color: #ff8f8f; }
      .faf-console-input {
        border: 0;
        border-top: 1px solid rgba(120, 160, 200, 0.25);
        background: rgba(0, 0, 0, 0.4);
        color: inherit;
        font: inherit;
        padding: 6px 10px;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas" tabindex="0"></canvas>
    <div id="ui-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
