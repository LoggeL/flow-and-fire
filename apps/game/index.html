<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flow &amp; Fire</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0f14;
        color: #d7e1ea;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      #game-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #ui-root {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #status {
        position: fixed;
        left: 16px;
        top: 12px;
        font-size: 14px;
        letter-spacing: 0.02em;
        text-shadow: 0 1px 2px #000;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="ui-root"></div>
    <div id="status">Flow & Fire – MS1-Gerüst</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
