<!doctype html>
<html lang="de"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Flow &amp; Fire | Audio-Gefecht</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#14191b;color:#e6eceb}*{box-sizing:border-box}body{margin:0}header{padding:12px 20px;border-bottom:1px solid #33403c;display:flex;justify-content:space-between;align-items:center}h1{font-size:19px;margin:0}main{display:grid;grid-template-columns:minmax(450px,1fr) 380px;min-height:calc(100vh - 63px)}#field{width:100%;height:calc(100vh - 100px);display:block;background:#19241f;touch-action:none}.view{position:relative;padding:16px}.help{font-size:12px;color:#a6b4b0;margin:0}aside{padding:16px;background:#1c2425;overflow:auto;height:calc(100vh - 63px)}h2{font-size:13px;color:#bacac5;margin:20px 0 8px}pre{font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap}button{background:#334f45;color:#eef9f0;border:1px solid #557b6a;border-radius:5px;padding:8px;cursor:pointer}input[type=range]{width:160px;accent-color:#85b99d}.bus{display:flex;align-items:center;justify-content:space-between;margin:6px 0;font-size:13px}.category{display:grid;grid-template-columns:90px 1fr 50px;gap:8px;font-size:11px;margin:3px 0}progress{width:100%;accent-color:#c2a06f}.controls{display:flex;gap:8px;align-items:center;font-size:12px}.controls input{width:62px;background:#26332f;color:inherit;border:1px solid #5b7168;padding:5px}#unlock{position:absolute;inset:0;display:grid;place-items:center;background:#09120dbb}#unlock[hidden]{display:none}#unlock button{font-size:19px;padding:24px}.alert{display:flex;justify-content:space-between;gap:8px;margin:6px 0;font-size:12px}.error{color:#ff9a89}@media(max-width:850px){main{grid-template-columns:1fr}aside{height:auto}#field{height:55vh}}
</style></head><body><header><h1>Flow &amp; Fire · Audio-Gefecht</h1><span id="status">Lade Klangbank</span></header><main><section class="view"><canvas id="field"></canvas><p class="help">WASD / Pfeile und Ziehen: Kamera · Mausrad: Höhe · Q/E: Drehen · Leertaste: letzter Alarm · Rechtsklick: Bewegungsquittung</p><div id="unlock"><button id="activate">Klicken zum Aktivieren des Tons</button></div></section><aside><div class="controls"><label>Schüsse/s <input id="shots" type="number" min="1" max="1000" value="200"/></label><label>Tempo <input id="speed" type="number" min="0.25" max="3" step="0.25" value="1"/></label><button id="restart">Start</button><button id="stop">Stop</button></div><h2>Stimmen und Limits</h2><div id="categories"></div><pre id="counters"></pre><h2>Zeit und Dekodierung</h2><pre id="timing"></pre><h2>Mischpult</h2><div id="buses"></div><label><input id="mute" type="checkbox"/> Stumm</label> <button id="ack">Klick-Quittung</button><h2>Alarme</h2><div id="alerts"></div></aside></main><script type="module" src="./src/main.ts"></script></body></html>
